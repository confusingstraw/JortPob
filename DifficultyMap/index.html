<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elden Scrolls Difficulty Gradient Map Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/p5.js"></script>
    
</head>
<body>
    <script src="sketch.js"></script>
    <div id="toolbar">
        <label id="color-label" for="color-picker">Color: 0</label>
        <input type="range" id="color-picker" name="color" min="0" max="100" value="0">

        <label id="alpha-label" for="alpha-picker">Alpha: 50</label>
        <input type="range" id="alpha-picker" name="alpha" min="0" max="100" value="50">

        <button id="toggle-grid">Toggle Grid</button>
        <button id="toggle-difficulty">Toggle Difficulty</button>
        <button id="export-drawing-png">Export Drawing PNG</button>
        <button id="export-canvas-png">Export Canvas PNG</button>
        <button id="export-json">Export JSON</button>
    </div>
    <div id="map-container"></div>
</body>
</html>
